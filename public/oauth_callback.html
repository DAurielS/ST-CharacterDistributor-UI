<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropbox Auth Callback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            padding: 20px;
            background-color: #2a2a2a;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #4AA5FF;
        }
        p {
            line-height: 1.6;
        }
        #status {
            margin: 20px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .success {
            background-color: rgba(0, 128, 0, 0.2);
            border: 1px solid #00aa00;
        }
        .error {
            background-color: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
        }
        #token-info {
            margin-top: 20px;
            word-break: break-all;
            text-align: left;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .guidance-box {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #4AA5FF;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Character Distributor Authentication</h2>
        <div id="status">
            Processing authentication... 
            <div class="spinner"></div>
        </div>
        <p>This window will automatically close in <span id="countdown">30</span> seconds.</p>
        <div id="token-info"></div>
        <div id="guidance"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('OAuth callback page loaded');
            
            // Parse the URL for authorization code
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const error = urlParams.get('error');
            const errorDescription = urlParams.get('error_description');
            
            const statusElement = document.getElementById('status');
            const tokenInfoElement = document.getElementById('token-info');
            const guidanceElement = document.getElementById('guidance');
            
            let countdown = 30; // Longer countdown to give user more time to read messages
            let autoClose = true;
            let isSuccess = false;
            let communicated = false;
            
            // Process the authorization code
            if (code) {
                console.log('Received authorization code');
                statusElement.innerHTML = 'Authorization code received. Processing...';
                statusElement.className = 'success';
                
                // Exchange code for token
                exchangeCodeForToken(code)
                    .then(tokenData => {
                        if (tokenData.access_token) {
                            isSuccess = true;
                            return handleSuccess(tokenData);
                        } else {
                            return handleError('No access token in response');
                        }
                    })
                    .catch(err => {
                        console.error('Error exchanging code for token:', err);
                        handleError(err.message || 'Failed to exchange authorization code for token');
                    });
            } else if (error) {
                console.error('Received error from authorization:', error, errorDescription);
                handleError(`${error}: ${errorDescription || 'Unknown error'}`);
            } else {
                console.error('No code or error in URL');
                handleError('No authorization code or error received');
            }
            
            // Function to exchange authorization code for token
            async function exchangeCodeForToken(authCode) {
                console.log('Exchanging code for token');
                
                try {
                    // Get the code verifier from sessionStorage (in parent window)
                    const codeVerifier = window.opener?.sessionStorage.getItem('dropbox_code_verifier');
                    console.log('Code verifier exists:', !!codeVerifier);
                    
                    if (!codeVerifier) {
                        throw new Error('Code verifier not found. Authentication session may have expired.');
                    }
                    
                    // Get app key from localStorage or query params
                    const appKey = getAppKey();
                    console.log('App key exists:', !!appKey);
                    
                    if (!appKey) {
                        throw new Error('App key not found. Cannot complete authentication.');
                    }
                    
                    // Build the redirect URI
                    const redirectUri = window.location.origin + window.location.pathname;
                    console.log('Redirect URI:', redirectUri);
                    
                    // Prepare token exchange request
                    const tokenRequestBody = new URLSearchParams();
                    tokenRequestBody.append('code', authCode);
                    tokenRequestBody.append('grant_type', 'authorization_code');
                    tokenRequestBody.append('client_id', appKey);
                    tokenRequestBody.append('redirect_uri', redirectUri);
                    tokenRequestBody.append('code_verifier', codeVerifier);
                    
                    // Make token request
                    console.log('Making token request to Dropbox API');
                    const response = await fetch('https://api.dropboxapi.com/oauth2/token', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded'
                        },
                        body: tokenRequestBody.toString()
                    });
                    
                    // Check response
                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error('Token request failed:', response.status, errorText);
                        throw new Error(`Token request failed (${response.status}): ${errorText}`);
                    }
                    
                    // Parse token response
                    const tokenData = await response.json();
                    console.log('Received token data:', {
                        access_token_length: tokenData.access_token?.length,
                        token_type: tokenData.token_type,
                        expires_in: tokenData.expires_in,
                        refresh_token_exists: !!tokenData.refresh_token
                    });
                    
                    return tokenData;
                } catch (error) {
                    console.error('Error in exchangeCodeForToken:', error);
                    throw error;
                }
            }
            
            // Handle successful token exchange
            function handleSuccess(tokenData) {
                console.log('Handling success');
                isSuccess = true;
                
                // First try to send token back via postMessage
                if (window.opener && !communicated) {
                    try {
                        console.log('Attempting to send token via postMessage');
                        window.opener.postMessage({
                            source: 'dropbox-auth',
                            accessToken: tokenData.access_token,
                            tokenType: tokenData.token_type,
                            expiresIn: tokenData.expires_in,
                            refreshToken: tokenData.refresh_token
                        }, '*');
                        
                        communicated = true;
                        console.log('Token sent via postMessage');
                        
                        // Update UI
                        statusElement.innerHTML = '<span style="color: #00aa00;">✓</span> Authentication successful! You can close this window.';
                        statusElement.className = 'success';
                        
                        // Auto-close window after a short delay
                        setTimeout(() => {
                            if (autoClose) window.close();
                        }, 2000);
                        
                        return true;
                    } catch (postMessageError) {
                        console.error('Error sending token via postMessage:', postMessageError);
                    }
                } else {
                    console.log('No opener window available or already communicated');
                }
                
                // Fallback to localStorage if postMessage fails or window.opener is unavailable
                try {
                    console.log('Storing token in localStorage');
                    localStorage.setItem('dropbox_auth_token', tokenData.access_token);
                    localStorage.setItem('dropbox_token_type', tokenData.token_type || 'bearer');
                    localStorage.setItem('dropbox_expires_in', tokenData.expires_in?.toString() || '14400');
                    localStorage.setItem('dropbox_auth_timestamp', Date.now().toString());
                    
                    if (tokenData.refresh_token) {
                        localStorage.setItem('dropbox_refresh_token', tokenData.refresh_token);
                    }
                    
                    communicated = true;
                    
                    // Update UI
                    statusElement.innerHTML = '<span style="color: #00aa00;">✓</span> Authentication successful! Token saved.';
                    statusElement.className = 'success';
                    
                    // Show guidance
                    guidanceElement.innerHTML = `
                        <div class="guidance-box">
                            <p><strong>✅ Authentication Complete!</strong></p>
                            <p>The token has been saved to your browser storage.</p>
                            <p>You can close this window and return to SillyTavern.</p>
                            <p>The authentication status should update automatically within a few seconds.</p>
                            <p>If not, click the "Check Auth Status" button in SillyTavern.</p>
                        </div>
                    `;
                    
                    return true;
                } catch (storageError) {
                    console.error('Error storing token in localStorage:', storageError);
                }
                
                // If all else fails, display token for manual copy
                console.log('Displaying token for manual copy');
                statusElement.innerHTML = 'Authentication successful, but unable to automatically send token.';
                statusElement.className = 'success';
                
                // Show manual copy UI
                tokenInfoElement.style.display = 'block';
                tokenInfoElement.innerHTML = `
                    <strong>Access Token:</strong> <br>
                    <code>${tokenData.access_token}</code><br><br>
                    <strong>Token Type:</strong> ${tokenData.token_type || 'bearer'}<br>
                    <strong>Expires In:</strong> ${tokenData.expires_in || 'N/A'} seconds<br>
                    <button id="copy-token">Copy Token</button>
                `;
                
                // Add guidance
                guidanceElement.innerHTML = `
                    <div class="guidance-box">
                        <h3>Manual Token Copy Required</h3>
                        <p>Please follow these steps:</p>
                        <ol>
                            <li>Copy the access token using the "Copy Token" button</li>
                            <li>Return to SillyTavern</li>
                            <li>In the "Dropbox Authentication" section, find the "Manual Token" textarea</li>
                            <li>Paste the token and click "Submit Token"</li>
                        </ol>
                    </div>
                `;
                
                // Stop auto-close
                autoClose = false;
                
                // Add copy button functionality
                document.getElementById('copy-token').addEventListener('click', function() {
                    navigator.clipboard.writeText(tokenData.access_token)
                        .then(() => {
                            this.textContent = 'Copied!';
                            setTimeout(() => {
                                this.textContent = 'Copy Token';
                            }, 2000);
                        })
                        .catch(err => {
                            console.error('Could not copy text: ', err);
                            this.textContent = 'Failed to copy';
                        });
                });
                
                return false;
            }
            
            // Handle error cases
            function handleError(errorMessage) {
                console.error('Auth error:', errorMessage);
                
                // Update UI
                statusElement.innerHTML = `Authentication failed: ${errorMessage}`;
                statusElement.className = 'error';
                
                // Show guidance
                guidanceElement.innerHTML = `
                    <div class="guidance-box">
                        <h3>Authentication Failed</h3>
                        <p>There was an error during authentication:</p>
                        <p style="color: #ff6b6b; font-weight: bold;">${errorMessage}</p>
                        <p>Please try again with the following steps:</p>
                        <ol>
                            <li>Close this window</li>
                            <li>Return to SillyTavern</li>
                            <li>Verify your Dropbox App Key and Secret are correct</li>
                            <li>Click "Authenticate with Dropbox" again</li>
                        </ol>
                    </div>
                `;
                
                autoClose = false;
                
                // Try to notify parent window
                if (window.opener && !communicated) {
                    try {
                        window.opener.postMessage({
                            source: 'dropbox-auth',
                            error: errorMessage
                        }, '*');
                        communicated = true;
                    } catch (e) {
                        console.error('Failed to send error to parent window:', e);
                    }
                }
                
                return false;
            }
            
            // Helper function to get app key from various sources
            function getAppKey() {
                // Try to get from URL params
                const urlAppKey = urlParams.get('app_key');
                if (urlAppKey) return urlAppKey;
                
                // Try to get from opener window if available
                if (window.opener) {
                    try {
                        // Check if extension_settings is available in opener window
                        const openerSettings = window.opener.extension_settings;
                        if (openerSettings && openerSettings['ST-CharacterDistributor-UI'] && 
                            openerSettings['ST-CharacterDistributor-UI'].dropboxAppKey) {
                            return openerSettings['ST-CharacterDistributor-UI'].dropboxAppKey;
                        }
                    } catch (e) {
                        console.warn('Could not access opener window settings:', e);
                    }
                }
                
                // Try localStorage as last resort
                try {
                    // Check for settings in localStorage
                    const settingsStr = localStorage.getItem('extensions_settings2');
                    if (settingsStr) {
                        const settings = JSON.parse(settingsStr);
                        if (settings && settings['ST-CharacterDistributor-UI'] && 
                            settings['ST-CharacterDistributor-UI'].dropboxAppKey) {
                            return settings['ST-CharacterDistributor-UI'].dropboxAppKey;
                        }
                    }
                } catch (e) {
                    console.warn('Could not access localStorage settings:', e);
                }
                
                return null;
            }
            
            // Countdown and close window
            const countdownElement = document.getElementById('countdown');
            
            const timer = setInterval(() => {
                countdown--;
                countdownElement.textContent = countdown;
                
                if (countdown <= 0) {
                    clearInterval(timer);
                    
                    if (autoClose && isSuccess) {
                        window.close();
                    } else {
                        countdownElement.parentElement.textContent = 'You can close this window when finished.';
                    }
                }
            }, 1000);
        });
    </script>
</body>
</html>
