<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropbox Auth Callback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            padding: 20px;
            background-color: #2a2a2a;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #4AA5FF;
        }
        p {
            line-height: 1.6;
        }
        #status {
            margin: 20px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .success {
            background-color: rgba(0, 128, 0, 0.2);
            border: 1px solid #00aa00;
        }
        .error {
            background-color: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
        }
        #token-info {
            margin-top: 20px;
            word-break: break-all;
            text-align: left;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .guidance-box {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Character Distributor Authentication</h2>
        <div id="status">Processing authentication...</div>
        <p>This window will automatically close in <span id="countdown">10</span> seconds.</p>
        <div id="token-info"></div>
        <div id="guidance"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Parse the URL fragment for the access token (Dropbox uses URL fragment)
            const fragment = window.location.hash.substring(1);
            const params = new URLSearchParams(fragment);
            const accessToken = params.get('access_token');
            const statusElement = document.getElementById('status');
            const tokenInfoElement = document.getElementById('token-info');
            let countdown = 10; // Increased countdown to give user more time to copy token if needed
            let autoClose = true;
            
            if (accessToken) {
                try {
                    // Try to send the token to the parent window (SillyTavern)
                    if (window.opener) {
                        window.opener.postMessage({
                            source: 'dropbox-auth',
                            accessToken: accessToken,
                            tokenType: params.get('token_type'),
                            expiresIn: params.get('expires_in'),
                            state: params.get('state')
                        }, '*');
                        
                        statusElement.textContent = 'Authentication successful! You can close this window.';
                        statusElement.className = 'success';
                    } else {
                        // Try to use localStorage as a fallback when window.opener is null
                        try {
                            // Store token in localStorage for the main page to retrieve
                            localStorage.setItem('dropbox_auth_token', accessToken);
                            localStorage.setItem('dropbox_token_type', params.get('token_type') || 'bearer');
                            localStorage.setItem('dropbox_expires_in', params.get('expires_in') || '14400');
                            localStorage.setItem('dropbox_auth_timestamp', Date.now().toString());
                            
                            statusElement.textContent = 'Authentication successful! Token saved. You can now close this window and return to SillyTavern.';
                            statusElement.className = 'success';
                            
                            // Show clear guidance
                            document.getElementById('guidance').innerHTML = `
                                <div class="guidance-box">
                                    <p><strong>✅ Authentication Complete!</strong></p>
                                    <p>The token has been saved to your browser storage.</p>
                                    <p>Please close this window and return to SillyTavern.</p>
                                    <p>Check the "Dropbox Authentication" panel in SillyTavern - it should update to "Authenticated" status.</p>
                                    <p>If the status doesn't update automatically, click the "Check Auth Status" button.</p>
                                </div>
                            `;
                            
                            // Attempt to close this window and focus the opener
                            setTimeout(() => {
                                try {
                                    window.close();
                                    window.opener && window.opener.focus();
                                } catch (e) {
                                    // Silent fail if cannot close
                                }
                            }, 2000);
                        } catch (storageError) {
                            // If localStorage fails too, fall back to manual copy
                            console.error('Cannot use localStorage:', storageError);
                            
                            // window.opener is null - likely opened in a new tab rather than a popup
                            statusElement.textContent = 'Authentication successful, but cannot automatically send the token to SillyTavern';
                            statusElement.className = 'success';
                            
                            // Display token info for manual copying with improved guidance
                            document.getElementById('guidance').innerHTML = `
                                <div class="guidance-box">
                                    <h3>Manual Token Copy Required</h3>
                                    <p>Please follow these steps:</p>
                                    <ol>
                                        <li>Copy the access token below using the "Copy Token" button</li>
                                        <li>Return to SillyTavern</li>
                                        <li>In the "Dropbox Authentication" section, find the "Manual Token" textarea</li>
                                        <li>Paste the token in the textarea</li>
                                        <li>Click the "Submit Token" button</li>
                                    </ol>
                                </div>
                            `;
                            
                            // Display token info for manual copying
                            tokenInfoElement.style.display = 'block';
                            tokenInfoElement.innerHTML = `
                                <strong>Access Token:</strong> <br>
                                <code>${accessToken}</code><br><br>
                                <strong>Token Type:</strong> ${params.get('token_type') || 'N/A'}<br>
                                <strong>Expires In:</strong> ${params.get('expires_in') || 'N/A'} seconds<br>
                                <button id="copy-token">Copy Token</button>
                            `;
                            
                            // Stop auto-close
                            autoClose = false;
                            
                            // Add copy button functionality
                            document.getElementById('copy-token').addEventListener('click', function() {
                                navigator.clipboard.writeText(accessToken)
                                    .then(() => {
                                        this.textContent = 'Copied!';
                                        setTimeout(() => {
                                            this.textContent = 'Copy Token';
                                        }, 2000);
                                    })
                                    .catch(err => {
                                        console.error('Could not copy text: ', err);
                                        this.textContent = 'Failed to copy';
                                    });
                            });
                        }
                    }
                } catch (error) {
                    // Handle any errors in communication
                    console.error('Error sending token to parent window:', error);
                    statusElement.textContent = `Communication error: ${error.message}. Please copy the token manually.`;
                    statusElement.className = 'error';
                    
                    // Display token for manual copying
                    tokenInfoElement.style.display = 'block';
                    tokenInfoElement.innerHTML = `
                        <strong>Access Token:</strong> <br>
                        <code>${accessToken}</code><br><br>
                        <button id="copy-token">Copy Token</button>
                    `;
                    
                    // Stop auto-close
                    autoClose = false;
                    
                    // Add copy button functionality
                    document.getElementById('copy-token').addEventListener('click', function() {
                        navigator.clipboard.writeText(accessToken)
                            .then(() => {
                                this.textContent = 'Copied!';
                            })
                            .catch(err => {
                                console.error('Could not copy text: ', err);
                                this.textContent = 'Failed to copy';
                            });
                    });
                }
            } else {
                // Check for error
                const error = params.get('error');
                const errorDescription = params.get('error_description');
                
                statusElement.textContent = `Authentication failed: ${errorDescription || error || 'Unknown error'}`;
                statusElement.className = 'error';
            }
            
            // Countdown and close window
            const countdownElement = document.getElementById('countdown');
            
            const timer = setInterval(() => {
                countdown--;
                countdownElement.textContent = countdown;
                
                if (countdown <= 0 && autoClose) {
                    clearInterval(timer);
                    window.close();
                } else if (countdown <= 0) {
                    clearInterval(timer);
                    countdownElement.parentElement.textContent = 'You can close this window when finished.';
                }
            }, 1000);
        });
    </script>
</body>
</html>
