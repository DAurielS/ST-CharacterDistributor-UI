<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropbox Auth Callback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            padding: 20px;
            background-color: #2a2a2a;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #4AA5FF;
        }
        p {
            line-height: 1.6;
        }
        #status {
            margin: 20px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .success {
            background-color: rgba(0, 128, 0, 0.2);
            border: 1px solid #00aa00;
        }
        .error {
            background-color: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Character Distributor Authentication</h2>
        <div id="status">Processing authentication...</div>
        <p>This window will automatically close in <span id="countdown">5</span> seconds.</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Parse the URL fragment for the access token (Dropbox uses URL fragment)
            const fragment = window.location.hash.substring(1);
            const params = new URLSearchParams(fragment);
            const accessToken = params.get('access_token');
            const statusElement = document.getElementById('status');
            
            if (accessToken) {
                // Send the token to the parent window (SillyTavern)
                window.opener.postMessage({
                    source: 'dropbox-auth',
                    accessToken: accessToken,
                    tokenType: params.get('token_type'),
                    expiresIn: params.get('expires_in'),
                    state: params.get('state')
                }, '*');
                
                statusElement.textContent = 'Authentication successful! You can close this window.';
                statusElement.className = 'success';
            } else {
                // Check for error
                const error = params.get('error');
                const errorDescription = params.get('error_description');
                
                statusElement.textContent = `Authentication failed: ${errorDescription || error || 'Unknown error'}`;
                statusElement.className = 'error';
            }
            
            // Countdown and close window
            let countdown = 5;
            const countdownElement = document.getElementById('countdown');
            
            const timer = setInterval(() => {
                countdown--;
                countdownElement.textContent = countdown;
                
                if (countdown <= 0) {
                    clearInterval(timer);
                    window.close();
                }
            }, 1000);
        });
    </script>
</body>
</html>
